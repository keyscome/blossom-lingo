<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Blossom Lingo</title>
<style>body{font:14px system-ui;width:330px;margin:0;padding:16px;color:#202124}h1{font-size:18px;margin:0 0 12px}h2{font-size:13px;margin:0 0 7px;color:#555}section{padding:11px 0;border-top:1px solid #eee}button,select,input{width:100%;box-sizing:border-box;margin:4px 0;padding:8px;border:1px solid #ccc;border-radius:7px;background:#fff}button.primary{background:#ffa116;border-color:#ffa116;color:#111;font-weight:650}.row{display:flex;gap:8px}.row>*{flex:1}label,.hint{font-size:12px;color:#666}.status{margin:10px 0;padding:9px;border-radius:7px;background:#f4f5f6;color:#555}a{color:#8a5700}</style></head>
