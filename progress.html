<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Blossom Lingo · 课程翻译进度</title><style>body{font:15px/1.6 system-ui;max-width:960px;margin:36px auto;padding:0 24px;color:#202124}h1{margin-bottom:4px}.muted{color:#687078}.bar{height:18px;background:#eee;border-radius:20px;overflow:hidden}.fill{height:100%;background:#ffa116;width:0;transition:width .3s}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}.card,.ollama,.notice{padding:14px;border:1px solid #ddd;border-radius:10px}.value{font-size:24px;font-weight:700}button{padding:8px 16px;margin:4px;border:1px solid #bbb;border-radius:7px;background:#fff}pre{height:240px;overflow:auto;background:#17191c;color:#e8eaed;padding:14px;border-radius:10px;white-space:pre-wrap}.ollama{margin:18px 0}.ollama h2{margin-top:0}.model{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid #eee}.notice{background:#fff8ed;border-color:#f2cf97;margin:16px 0}@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><h1>Blossom Lingo</h1><p class="muted" id="phase">等待任务…</p><div class="bar"><div class="fill" id="fill"></div></div><p id="current"></p><div class="stats"><div class="card"><div class="value" id="done">0/0</div>总进度</div><div class="card"><div class="value" id="success">0</div>讲义</div><div class="card"><div class="value" id="exercises">0</div>练习题</div><div class="card"><div class="value" id="skipped">0</div>跳过</div><div class="card"><div class="value" id="failed">0</div>失败</div></div><div class="notice">暂停或取消不会清除数据：已返回批次的段落缓存、已完成文章的归档和课程目录都会保留；被中断且尚未返回的当前批次不会缓存。</div><p><button id="pause">暂停并中断推理</button><button id="resume">继续</button><button id="cancel">取消任务</button><button id="retryFailed">仅重试失败项</button></p><section class="ollama"><h2>Ollama 工作状态</h2><p id="inference">正在读取…</p><div id="models"></div><button id="abortInference">仅中断当前推理</button></section><pre id="logs"></pre><script src="progress.js"></script></body></html>
