<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>本地翻译设置</title>
<style>body{font:15px system-ui;max-width:620px;margin:40px auto;padding:0 20px;color:#202124}label{display:block;font-weight:650;margin-top:18px}input{width:100%;box-sizing:border-box;padding:9px;margin-top:6px;border:1px solid #bbb;border-radius:7px}button{margin-top:22px;padding:9px 18px;border:0;border-radius:7px;background:#ffa116;font-weight:700}.hint{color:#666;font-size:13px}.ok{margin-left:10px;color:#187a37}</style></head>
<body><h1>LeetCode 本地翻译设置</h1><p>所有请求仅发送到这里配置的本机 Ollama 服务。</p><label>Ollama 地址<input id="endpoint" placeholder="http://127.0.0.1:11434"></label><label>模型<input id="model" placeholder="qwen3:8b"></label><p class="hint">推荐 qwen3:8b；内存紧张可用 qwen3:4b，更重视质量可选择更大的中英模型。</p><label>目标语言<input id="targetLanguage" placeholder="Simplified Chinese"></label><label>Temperature<input id="temperature" type="number" min="0" max="1" step="0.1"></label><button id="save">保存</button><span class="ok" id="saved"></span>
<section style="margin-top:38px;border-top:1px solid #ddd;padding-top:24px"><h2>首次授权 Ollama</h2><p>Ollama 默认拒绝浏览器扩展的来源。下面的命令只授权当前扩展：</p><label>当前扩展 Origin<input id="extensionOrigin" readonly></label><label>在 macOS 终端运行<input id="setupCommand" readonly></label><button id="copyCommand" type="button">复制命令</button><p class="hint">运行后，从 macOS 菜单栏彻底退出 Ollama，再重新打开 Ollama 应用。仅重新加载浏览器扩展不会让 Ollama 读取新环境变量。</p></section>
<script src="options.js"></script></body></html>
